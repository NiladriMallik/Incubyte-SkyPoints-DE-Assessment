version: 2Q

models:
  - name: stg_member_feed
    columns:
      - name: member_id
        tests: [not_null, unique]

      - name: member_name
        tests: [not_null]
      - name: country_code

        tests:
          - not_null
          - relationships:
              to: ref('country_map')
              field: country_code

      - name: tier_code
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['PLT', 'GLD', 'SLV']

      - name: enrollment_date
        tests:
          - not_null:
              config:
                severity: warn

      - name: flight_date
        tests:
          - not_null:
              config:
                  severity: warn

      - name: date_of_birth
        tests:
          - not_null:
              config:
                severity: warn

  - name: stg_redemptions
    description: One row per redemption transaction, flattened from the JSON feed.
    columns:
      - name: txn_id
        tests: [not_null, unique]

      - name: member_id
        tests: [not_null]

      - name: status
        tests:
          - accepted_values:
              arguments:
                values: ['COMPLETED', 'PENDING']
              config:
                severity: warn

      - name: miles_redeemed
        tests: [not_null]