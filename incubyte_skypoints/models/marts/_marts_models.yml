version: 2

models:

  - name: members
    columns:
      - name: member_key
        tests: [unique, not_null]
      
      - name: member_id
        tests: [unique, not_null]

      - name: tier_name
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Platinum', 'Gold', 'Silver']

      - name: stale_member
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [true, false]
                quote: false

      - name: dq_status
        tests:
          - accepted_values:
              arguments:
                values: ['OK', 'REVIEW']

      - name: age_at_enrollment
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 120
              config:
                severity: warn


